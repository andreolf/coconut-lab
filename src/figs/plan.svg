<svg class="fig-svg" viewBox="0 0 640 400" role="img" aria-labelledby="t-plan" xmlns="http://www.w3.org/2000/svg"><title id="t-plan">Plan view: the boulder blocks the near bank, the fast jet separates from it, and a slow lateral eddy of width W fills its lee. The coconut circles inside the eddy, bounded by the shear layer.</title><defs><marker id="ah-plan-EEFF41" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EEFF41"/></marker><marker id="ah-plan-bbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bbb"/></marker></defs><rect x="0" y="0" width="640" height="400" fill="#0d2a3d" opacity=".55"/><rect x="0" y="372" width="640" height="28" fill="#1a1a1a"/><rect x="0" y="0" width="640" height="22" fill="#1a1a1a"/><text x="10.0" y="392.0" class="" text-anchor="start" fill="#8a8a8a" font-size="20" >near bank</text><text x="10.0" y="16.0" class="" text-anchor="start" fill="#8a8a8a" font-size="20" >far bank</text><path d="M88 372 C 80 300, 120 250, 175 252 C 230 255, 250 310, 245 372 Z" stroke="#8a8a8a" stroke-width="2.5" fill="#5a5a5a" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="166.0" y="330.0" class="hand" text-anchor="middle" fill="#e8e8e8" font-size="31" >boulder</text><line x1="20.0" y1="70.0" x2="610.0" y2="70.0" stroke="#EEFF41" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-plan-EEFF41)"/><line x1="20.0" y1="120.0" x2="610.0" y2="120.0" stroke="#EEFF41" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-plan-EEFF41)"/><line x1="20.0" y1="170.0" x2="610.0" y2="182.0" stroke="#EEFF41" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-plan-EEFF41)"/><line x1="20.0" y1="215.0" x2="610.0" y2="227.0" stroke="#EEFF41" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ah-plan-EEFF41)"/><text x="330.0" y="60.0" class="hand" text-anchor="middle" fill="#EEFF41" font-size="32" >fast jet / chute  U ≈ 2.5 m/s</text><path d="M250 258 C 330 250, 420 252, 520 262" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" stroke-dasharray="7 7"/><text x="528.0" y="258.0" class="hand" text-anchor="start" fill="#ffffff" font-size="29" >shear layer</text><path d="M300 340 C 280 300, 330 278, 400 280 C 470 282, 500 310, 480 340 C 460 362, 330 366, 300 340" stroke="#EEFF41" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.75" marker-end="url(#ah-plan-EEFF41)"/><text x="520.0" y="330.0" class="hand" text-anchor="start" fill="#EEFF41" font-size="29" >lateral eddy</text><text x="520.0" y="352.0" class="" text-anchor="start" fill="#EEFF41" font-size="20" >Uₑ ≈ 0.35 m/s</text><circle cx="352" cy="318" r="11" fill="#7a4a22" stroke="#ff3b30" stroke-width="3"/><path d="M346.5 315.8 q5.5 -5.5 11 0" stroke="#c48a55" stroke-width="1.6" fill="none"/><text x="352.0" y="304.0" class="hand" text-anchor="middle" fill="#ff3b30" font-size="27" >coconut</text><line x1="258.0" y1="372.0" x2="258.0" y2="262.0" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-plan-bbb)"/><line x1="258.0" y1="262.0" x2="258.0" y2="372.0" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-plan-bbb)"/><text x="266.0" y="368.0" class="" text-anchor="start" fill="#bbb" font-size="20" >W ≈ 1.2 m</text><path d="M245 384 L 520 384" stroke="#bbb" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="382.0" y="398.0" class="small" text-anchor="middle" fill="#bbb" font-size="17" >L ≈ 2.5 m (≈ 2 boulder sizes) to reattachment</text><text x="612.0" y="140.0" class="hand" text-anchor="end" fill="#EEFF41" font-size="26" >flow</text></svg>
