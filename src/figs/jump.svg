<svg class="fig-svg" viewBox="0 0 640 445" role="img" aria-labelledby="t-jump" xmlns="http://www.w3.org/2000/svg"><title id="t-jump">Side view of the plunge: the chute (Fr about 2) accelerates down the 0.75 m drop to a toe with Fr about 5.1. Its conjugate depth is 0.55 m, but the pool is about 0.8 m deep, so the jump is drowned into a submerged roller.</title><defs><marker id="ah-jump-EEFF41" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EEFF41"/></marker><marker id="ah-jump-bbb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#bbb"/></marker><marker id="ah-jump-fff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs><path d="M0 120 L150 120 L150 360 L0 360 Z" stroke="#8a8a8a" stroke-width="2" fill="#4a4a4a" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="75.0" y="250.0" class="hand" text-anchor="middle" fill="#e8e8e8" font-size="29" >boulder</text><path d="M0 100 L150 100 C 175 102, 190 180, 205 330 L 260 330 C 300 300, 340 160, 400 150 L 640 150 L 640 360 L 150 360 L 150 120 L 0 120 Z" stroke="none" stroke-width="0" fill="#0d2a3d" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M0 100 L150 100 C 175 102, 190 180, 205 330" stroke="#5abeff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M150 120 C 165 140, 175 220, 185 330" stroke="#5abeff" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M260 330 C 300 300, 340 160, 400 150 L 640 150" stroke="#5abeff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><line x1="20.0" y1="92.0" x2="110.0" y2="92.0" stroke="#EEFF41" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-jump-EEFF41)"/><text x="20.0" y="80.0" class="" text-anchor="start" fill="#EEFF41" font-size="20" >U₁ ≈ 2.5 m/s, y₁ ≈ 0.15 m, Fr₁ ≈ 2</text><line x1="200.0" y1="345.0" x2="255.0" y2="345.0" stroke="#EEFF41" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-jump-EEFF41)"/><text x="20.0" y="392.0" class="" text-anchor="start" fill="#EEFF41" font-size="20" >toe: U ≈ 4.6 m/s, y ≈ 8 cm, Fr ≈ 5.1</text><path d="M300 210 C 260 170, 230 220, 270 250 C 300 270, 330 240, 315 215" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1" marker-end="url(#ah-jump-fff)"/><text x="330.0" y="200.0" class="hand" text-anchor="start" fill="#fff" font-size="29" >roller</text><rect x="185" y="125" width="260" height="235" fill="none" stroke="#fff" stroke-width="1.8" stroke-dasharray="7 6"/><text x="190.0" y="118.0" class="" text-anchor="start" fill="#fff" font-size="18" >control volume</text><line x1="600.0" y1="150.0" x2="600.0" y2="360.0" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-jump-bbb)"/><line x1="600.0" y1="360.0" x2="600.0" y2="150.0" stroke="#bbb" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah-jump-bbb)"/><text x="592.0" y="300.0" class="" text-anchor="end" fill="#bbb" font-size="20" >pool ≈ 0.8 m</text><line x1="470.0" y1="360.0" x2="470.0" y2="222.0" stroke="#EEFF41" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/><text x="470.0" y="212.0" class="" text-anchor="middle" fill="#EEFF41" font-size="20" >conjugate y₂ ≈ 0.55 m</text><line x1="380.0" y1="222.0" x2="560.0" y2="222.0" stroke="#EEFF41" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 5"/><line x1="490.0" y1="335.0" x2="580.0" y2="335.0" stroke="#EEFF41" stroke-width="3" stroke-linecap="round" marker-end="url(#ah-jump-EEFF41)"/><path d="M0 360 L640 360" stroke="#8a8a8a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><text x="20.0" y="428.